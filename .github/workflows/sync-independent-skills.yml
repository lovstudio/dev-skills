name: Sync independent skill releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-independent-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog dependencies
        run: python3 -m pip install pyyaml
      - name: Sync latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-independent-skills.py sync
      - name: Render catalogs
        run: python3 scripts/render-readme.py
      - name: Commit updated mirrors
        run: |
          if git diff --quiet; then
            echo "All independent skill mirrors are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills skills.yaml README.md README.en.md independent-skills.json
          git commit -m "chore: sync independent skill releases"
          git push
