    pass.
  tagline_zh: 一次过清理 GitHub 上的 issue、PR、分支和标签，让仓库重新整洁。
- name: install-tanstack-query
  repo: lovstudio/dev-skills
  skill_path: skills/install-tanstack-query
  name_zh: TanStack Query 初始化
  paid: false
  category: Dev Tools
  version: 0.1.0
  description: Initialize or refactor a frontend project to use TanStack Query as
