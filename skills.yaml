  tagline_en: Initialize TanStack Query and migrate request state into shared query
    keys and hooks.
  tagline_zh: 初始化 TanStack Query，并把分散的请求状态收敛到统一 query keys 和 hooks。
- name: obsidian-reset-cache
  repo: lovstudio/obsidian-reset-cache-skill
