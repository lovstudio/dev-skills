- name: clash-tun-doctor
  repo: lovstudio/clash-tun-doctor-skill
  name_zh: Clash TUN 网络医生
  paid: false
  category: Dev Tools
  version: 0.1.0
  description: Diagnose and reversibly repair application connectivity failures caused
    by Clash Verge Rev TUN rules, stale runtime state, proxy timeouts, or unusable IPv6 paths.
